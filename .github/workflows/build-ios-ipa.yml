name: Build NovaPlay iOS 15+ IPA

on:
  workflow_dispatch:
    inputs:
      include_mpv:
        description: "Bundle NovaMpv / libmpv (MPV Metal + VideoToolbox kernel)"
        required: false
        default: true
        type: boolean
      include_vlc:
        description: "Bundle MobileVLCKit (FFmpeg multi-format kernel alongside AVPlayer & MPV)"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS 15+ IPA (TrollStore / Self-Sign / Enterprise)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Flutter app directory
        id: dirs
        run: |
          if [[ -f "pubspec.yaml" ]]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f "uzv-reimpl/flutter_app/pubspec.yaml" ]]; then
            echo "app_dir=uzv-reimpl/flutter_app" >> "$GITHUB_OUTPUT"
          else
            echo "Could not locate Flutter pubspec.yaml" >&2
            exit 1
          fi

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ldid for TrollStore & sideload pseudo-signing
        run: brew install ldid

      - name: Cache NodeMobile.xcframework
        uses: actions/cache@v4
        with:
          path: ${{ steps.dirs.outputs.app_dir }}/packages/novaplay_ios/ios/Frameworks/NodeMobile.xcframework
          key: nodemobile-ios-v18.20.4

      - name: Cache NovaMpv.xcframework
        if: inputs.include_mpv != false
        uses: actions/cache@v4
        with:
          path: ${{ steps.dirs.outputs.app_dir }}/packages/novaplay_ios/ios/Frameworks/NovaMpv.xcframework
          key: novampv-ios-arm64-v1-${{ hashFiles('**/fetch_mpvkit.sh') }}

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-cache-${{ runner.os }}-mpv-${{ inputs.include_mpv != false }}-vlc-${{ inputs.include_vlc != false }}-${{ hashFiles('**/Podfile', '**/novaplay_ios.podspec', '**/pubspec.lock') }}
          restore-keys: |
            cocoapods-cache-${{ runner.os }}-mpv-${{ inputs.include_mpv != false }}-vlc-${{ inputs.include_vlc != false }}-
            cocoapods-cache-${{ runner.os }}-

      - name: Run Flutter unit & widget tests
        working-directory: ${{ steps.dirs.outputs.app_dir }}
        run: |
          flutter pub get
          flutter gen-l10n
          flutter test

      - name: Build & package 3-in-1 iOS 15+ .ipa
        working-directory: ${{ steps.dirs.outputs.app_dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVAPLAY_WITH_MPV: ${{ inputs.include_mpv == false && '0' || '1' }}
          NOVAPLAY_WITH_VLC: ${{ inputs.include_vlc == false && '0' || '1' }}
        run: bash ios/scripts/package_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-ios15-ipa
          path: ${{ steps.dirs.outputs.app_dir }}/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dirs.outputs.app_dir }}/build/ios/ipa/*.ipa
