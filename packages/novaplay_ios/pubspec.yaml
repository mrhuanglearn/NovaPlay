name: novaplay_ios
description: Native iOS 15+ player, danmaku, haptics, and embedded Node.js runtime plugin for NovaPlay (星映).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NovaPlayIosPlugin
